name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK via Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hub-frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install frontend dependencies
        working-directory: hub-frontend
        run: npm ci

      - name: Create .env file with Render URLs
        working-directory: hub-frontend
        run: |
          # 🛑 PUNE AICI LINKUL DE LA RENDER 🛑
          # Înlocuiește 'LINKUL_TAU_AICI' cu adresa ta, de exemplu: https://smarthub-backend-ab2x.onrender.com
          
          echo "VITE_API_URL=https://smarthub-backend-09he.onrender.com" > .env
          echo "VITE_WS_URL=wss://smarthub-backend-09he.onrender.com" >> .env
          echo "VITE_GEMINI_API_KEY=" >> .env

      - name: Build Vite production bundle
        working-directory: hub-frontend
        run: npm run build

      - name: Install Capacitor CLI
        working-directory: hub-frontend
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle execute permission
        working-directory: hub-frontend/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: hub-frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartHub-debug-${{ github.sha }}
          path: hub-frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: hub-frontend/android/app/build/outputs/apk/debug/app-debug.apk
          name: SmartHub ${{ github.ref_name }}
